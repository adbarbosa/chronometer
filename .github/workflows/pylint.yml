name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: chronometer

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  tests:
    name: Tests and lint (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: chronometer

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Analyze application and test modules
        run: python -m pylint "*.py" "i18n/*.py"

      - name: Run tests
        run: python -m pytest -q . --ignore=.venv

  packaged-startup:
    name: Packaged startup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: chronometer

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile translations
        run: python i18n/compile.py

      - name: Build executable
        run: python build.py

      - name: Check Linux bundle and startup
        if: runner.os == 'Linux'
        run: python smoke_check.py dist/Chronometer --seconds 5

      - name: Check Windows bundle and startup
        if: runner.os == 'Windows'
        run: python smoke_check.py dist/Chronometer.exe --seconds 5
